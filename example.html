<!doctype html>
<html>
<head>
    <title>Timeline Component Prototype</title>
    <meta name=theme-color content=#303F9F><meta name=viewport content="width=device-width,minimum-scale=1">
    <style>
        body {
          font-family: "HelveticaNeue-Light", "Helvetica Neue Light", "Helvetica Neue", Helvetica, Arial, "Lucida Grande", sans-serif;
          background-color: whitesmoke;
          padding: 10px;
        }

        snabbdom-timeline {
          border: 1px solid #adafaf;
        }
    </style>
</head>
<body>

<p>
In this example, the top graph shows all data over time. The bottom graph shows the same data set, but only
within the selected time range of the top graph.
</p>

<p>
    <label>
        renderer:
        <select id="renderer">
            <option value="svg">svg</option>
            <option value="canvas">canvas</option>
        </select>
    </label>
</p>

<snabbdom-timeline renderer="svg"></snabbdom-timeline>
        
<script type="importmap">
  {
    "imports": {
      "snabbdom": "https://esm.sh/snabbdom",
      "@footgun/math-gap": "https://esm.sh/@footgun/math-gap"
    }
  }
</script>

<script type="module">

import './src/index.js'


const clamp = (value, min, max) => Math.min(Math.max(value, min), max)
const randomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min


// shows all data over time
const overview = {
    title: 'all data',
    label: 'all time',
    type: 'linePlot',  // scatterPlot | linePlot
    timeRange: {
        start: 0,  // seconds
        end: 0     // seconds
    },
    yRange: {
        start: 0,
        end: 100
    },
    selection: {
        type: 'range',
        start: 0,         // seconds | 0
        end: Infinity,    // seconds | Infinity
        dragging: false
    },
    height: 60,           // pixels
    dataColor: 'dodgerblue',
    linePlotAreaColor: 'rgba(41, 147, 251, 0.3)', // color to fill area if in linePlot mode
    renderTicks: false,
    renderValueLabel: false,
    data: [ ]
}


// shows the data within the overview's selected range
const detail = {
    title: 'selected data',
    label: 'selected time',
    type: 'scatterPlot',  // scatterPlot | linePlot
    timeRange: {
        start: 0,  // seconds
        end: 0     // seconds
    },
    yRange: {
        start: 0,
        end: 100
    },
    selection: {
        type: 'value',
        time: Infinity,
        dragging: false
    },
    height: 140,           // pixels
    dataColor: 'dodgerblue',
    renderTicks: true,
    renderValueLabel: true,
    gridLines: {
        vertical: {
            majorColor: '#dedede',
            minorColor: '#f3f3f3',
            ticksPerMinor: 2.5,
            ticksPerMajor: 10
        },
        horizontal: {
            color: '#eeeeee',
            lineCount: 2
        }
    },
    data: [ ]
}


const timeline = document.querySelector('snabbdom-timeline')
timeline.graphs = [ overview, detail ]


// link the lower graph to show data within the selected range from the upper graph
function link () {
    detail.timeRange.start = (overview.selection.start === 0) ? overview.timeRange.start : overview.selection.start
    detail.timeRange.end = (overview.selection.end === Infinity) ? overview.timeRange.end : overview.selection.end

    if (detail.selection.time !== Infinity)
        detail.selection.time = clamp(detail.selection.time, detail.timeRange.start, detail.timeRange.end)
}


// fires continuously while a selection control is dragged. the element
// re-renders after the event, so changes made here show up immediately.
timeline.addEventListener('input', link)


document.querySelector('#renderer').addEventListener('change', (ev) => {
    timeline.renderer = ev.target.value
})


// pump test data into the graphs every 2 seconds
setInterval(function () {
    // generate the data point, insert it into both graphs
    const t = performance.now() / 1000
    const value = randomInt(overview.yRange.start, overview.yRange.end)

    overview.data.push({ t, value })
    detail.data.push({ t, value })

    overview.timeRange.end = t

    link()
    timeline.update()
}, 2000)

</script>

</body>
</html>
